name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit zip
      - name: Check tag against _meta.lua
        id: version
        run: |
          version="$(luajit -e 'print(dofile("_meta.lua").version)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in _meta.lua"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate cards
        run: luajit tools/validate.lua
      - name: Engine tests
        run: luajit tests/engine_spec.lua
      - name: Simulate games
        run: luajit tools/simulate.lua 1000
      - name: Build package
        run: tools/package.sh
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/sindico_game.koplugin.zip dist/sindico_game.koplugin.zip.sha256 --title "O Síndico $VERSION" --notes-file notes.md
